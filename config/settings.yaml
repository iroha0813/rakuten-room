# 楽天ROOM 投稿候補生成 — 全体設定
# ここを書き換えれば挙動が変わる。コードには定数を埋め込まない方針。

# 1日に生成する投稿候補の件数
# 【スーパーSALE対応・一時変更】5→10。2026-09-04〜09-11の期間限定。
# サール終了後は5に戻すこと（元の値はjournal/2026-09-03.mdに記録）。
daily_count: 10

# 候補プールを daily_count の何倍集めるか（絞り込みの余地を作る）
candidate_pool_multiplier: 5

# ---- ジャンル設定 -------------------------------------------------------
# genre_id は scripts/fetch_genres.py が config/genres.yaml に書き出す。
# share は配分比率。合計が daily_count に按分される（例 2:2:1 で5件なら 2/2/1）。
# match は楽天市場のルートジャンル名に対する部分一致キーワード。
# scripts/fetch_genres.py がこれを使って実際のジャンルIDを引き当てる。
genres:
  daily_goods:
    label: 日用品・キッチン雑貨
    # 【スーパーSALE対応・一時変更】share 2→3。買いまわり対象になりやすく
    # 9/2実測でも反応が良かったジャンルのため厚くする。09-11後に2へ戻す。
    share: 3
    price_min: 1000
    # 【高単価仮説・2026-09-11】8000→15000。経由購入の実績はまだ8000円以下に
    # 偏っているが、高単価帯が候補プールにすら入っていないため検証できない
    # 状態だった。まず候補に入れて反応を見る。
    price_max: 15000
    match:
      - 日用品雑貨
      - キッチン用品
  gadget:
    label: ガジェット・PC周辺
    share: 1
    price_min: 2000
    price_max: 30000
    match:
      - スマートフォン
      - TV・オーディオ・カメラ
    # ノートPC本体(新品/中古とも)は投稿してもいいねが0件続きだったため
    # 「パソコン・周辺機器」ジャンルはmatchから除外した。2026-09-02判断。
    # スーパーSALE期間もshareは1のまま据え置き（買いまわり向きではないため増やさない）。
  storage:
    label: インテリア・寝具・収納
    # 【スーパーSALE対応・一時変更】share 2→3。理由はdaily_goodsと同じ。09-11後に2へ戻す。
    share: 3
    price_min: 1000
    # 【高単価仮説・2026-09-11】8000→20000。家具・寝具は単価が上がりやすいジャンル。
    price_max: 20000
    match:
      - インテリア・寝具・収納
  food:
    label: 食品・飲料・ふるさと納税
    # 【スーパーSALE対応・一時変更】share 1→2。消耗品で買いまわりの点数稼ぎに使われやすい。
    # 09-11後に1へ戻す。
    share: 2
    price_min: 2000
    # 【高単価仮説・2026-09-11】15000→20000。ふるさと納税の高額返礼品を含めやすくする。
    price_max: 20000
    match:
      - 食品
      - スイーツ・お菓子
      - 水・ソフトドリンク
    # ふるさと納税は楽天市場のジャンルツリーに存在しない（別サービス扱い）ため、
    # ジャンルIDでは指定できない。キーワード検索で拾う。
    keywords:
      - ふるさと納税

# ---- 収集 ---------------------------------------------------------------
collect:
  min_review_average: 4.0   # これ未満のレビュー評価は拾わない
  min_review_count: 20      # レビューが少なすぎる商品は評価が固まっていない
  ranking_hits: 30          # ランキングAPIから拾う件数
  search_hits: 30           # 商品検索APIから1ページあたり拾う件数
  search_sort: "-reviewCount" # 並び順。楽天側が拒否する場合は "standard" にする
  search_max_pages: 3       # 候補が目標数に届くまで最大何ページ辿るか
  request_interval_sec: 1.0 # 楽天APIへのリクエスト間隔（必ず1秒以上空ける）
  max_retries: 3

# ---- 選定 ---------------------------------------------------------------
selection:
  max_per_shop: 1           # 同一ショップから1日に出す上限（スパム的に見せない）
  max_per_type: 1           # 同一商品タイプ（product_type参照）から1日に出す上限
  history_ttl_days: 180     # これより古い提示履歴は重複判定から外す

# ---- 商品タイプの多様性制御 ----------------------------------------------
# 「マットレスを何度も勧める」のように同じような商品が繰り返し出るのを防ぐ。
# 商品名にキーワードが含まれていたら該当タイプとみなす（上から順に判定し、
# 最初に一致したものを採用。水切りラックが「ラック」に埋もれないよう、
# 具体的なキーワードを先に書くこと）。過去投稿を見て繰り返しが目についた
# タイプが増えたら随時ここに追記していく運用とする（2026-09-07導入）。
product_type:
  window_days: 14           # この日数以内の同タイプ出現を選定時に減点する
  categories:
    mattress: [マットレス]
    pillow: [枕]
    futon: [布団, 掛け布団, 敷き布団]
    dish_rack: [水切りラック, 水切りかご, 水切り]
    storage_box: [収納ボックス, 収納ケース, チェスト]
    food_container: [保存容器, 密閉容器, 保存ボトル]
    earphone: [イヤホン]
    mobile_battery: [モバイルバッテリー]
    rack: [ラック]

# ---- リピート購入品への加点 ----------------------------------------------
# 【仮説・2026-09-11】経由購入の実績（n=3、9/4発生）は3件とも「切れたら買い足す
# 実用品」（米びつ、業務用冷凍肉、育児消耗品）だった。定期的に必ず買うものは
# 「見た瞬間に経由してしまう」需要があるのではという仮説をスコアに反映して検証する。
# 商品名にキーワードが含まれていたら加点対象（product_typeと同じcategorize()を流用、
# 多様性抑制とは目的が別のため独立したセクションにしている）。
repeat_purchase:
  categories:
    tissue_paper: [トイレットペーパー, ティッシュ, キッチンペーパー]
    detergent: [洗剤, 柔軟剤]
    toiletry: [シャンプー, ボディソープ, コンディショナー, 歯磨き粉, 歯ブラシ]
    mask: [マスク]
    trash_bag: [ゴミ袋, ポリ袋]
    rice: [お米, 精米, パックご飯]
    beverage: [ミネラルウォーター, お茶, コーヒー, 水 500ml, 炭酸水]
    frozen_food: [冷凍食品, レトルト, 業務用]
    supplement: [サプリメント, プロテイン]
    pet_food: [ペットフード, キャットフード, ドッグフード, 猫砂]
    baby_care: [おむつ, おしりふき, 生理用品]

# ---- セール期間ブースト -------------------------------------------------
# お買い物マラソン/スーパーSALE 中に特定ジャンルを厚くしたいとき有効化する
sale_boost:
  enabled: false
  genre_key: null
  multiplier: 1.5

# ---- プレゼン文生成 -----------------------------------------------------
llm:
  model: claude-haiku-4-5   # claude-opus-5 に変えれば品質が上がる（コストも上がる）
  max_tokens: 1024
  # ROOMのコメント欄の上限は500字。フィードで実際に見えるのは冒頭40〜60字なので、
  # 長さそのものより1行目の強さが効く。ここは「冗長になりすぎない」ための上限。
  max_chars: 250

  # 直近何日ぶんの「切り口・型」を避けるか。投稿が同じ型に見えるのを防ぐ。
  # 選択肢を使い切ったら、古く使ったものから戻ってくる。
  variation_window_days: 14

  # クーポン・送料無料・ポイント倍率・セールを本文に書いてよいか。
  # ROOMのフィードで最も反応が取れる訴求だが、条件が変わると古い情報になる。
  # true にしても「1,980円」のような絶対額は常に禁止のまま（価格が違うのは
  # 条件が変わるより重い嘘になるため）。
  allow_deal_info: true

# ---- アフィリエイト -----------------------------------------------------
affiliate:
  commission_rate: 0.02     # 想定報酬の見積りに使う（楽天の標準料率）

  # false のままにすること。
  # true にすると楽天APIに affiliateId を渡し、itemUrl が
  # hb.afl.rakuten.co.jp のリダイレクトURLに差し替わる。
  # ROOMの「コレ！」は楽天市場の商品ページURL(item.rakuten.co.jp/...)を
  # 前提とするため、ROOM運用では商品を認識できなくなる。
  # 将来ブログやSNSに直接リンクを貼るときだけ true にする。
  use_affiliate_links: false

# ---- 成果CSV取り込み ----------------------------------------------------
# 楽天アフィリエイト管理画面からDLしたCSVの列名。
# 楽天側の仕様変更で列名が変わったらここを直す（コードは触らなくてよい）。
report:
  encoding: cp932
  columns:
    date: 発生日
    item_name: 商品名
    item_code: 商品ID
    price: 商品価格
    reward: 報酬額
    count: 件数
