# スコアリングの重み。
# room/report.py の分析結果を見ながら手で調整する。
# 各項目の意味は room/score.py を参照。

review_count: 1.0   # レビュー件数（log10）— 実績のある商品を優遇
review_avg: 0.8     # レビュー平均 - 3.0 — 評価の高さ
rank: 1.2           # ランキング掲載ボーナス — 「今売れている」ことの重み
price_fit: 0.6      # 設定価格帯の中央への近さ
commission: 0.9     # 想定報酬額（log10）— 単価の高さ
shop_repeat: 1.5    # 同一ショップの直近出現に対する減点（この値は引かれる）
