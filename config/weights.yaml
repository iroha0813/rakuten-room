# スコアリングの重み。
# room/report.py の分析結果を見ながら手で調整する。
# 各項目の意味は room/score.py を参照。

review_count: 1.0   # レビュー件数（log10）— 実績のある商品を優遇
review_avg: 0.8     # レビュー平均 - 3.0 — 評価の高さ
rank: 1.2           # ランキング掲載ボーナス — 「今売れている」ことの重み
price_fit: 0.6      # 設定価格帯の中央への近さ
# 【高単価仮説・2026-09-11】0.9→1.6。log10なので単価だけでは効きが弱く、
# 元の重みでは他要素に埋もれていた。単価の高さをより強く後押しする。
commission: 1.6     # 想定報酬額（log10）— 単価の高さ
shop_repeat: 1.5    # 同一ショップの直近出現に対する減点（この値は引かれる）
type_repeat: 1.2    # 同一商品タイプ（product_type参照）の直近出現に対する減点
# 【リピート品仮説・2026-09-11】新規。repeat_purchase（config/settings.yaml）に
# 一致したら加点。review_count/rankと同程度の重みを初期値にして様子を見る。
repeat_bonus: 1.0
