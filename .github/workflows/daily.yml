name: daily-candidates

# 定期実行は無効。楽天ウェブサービスはアプリ登録時の「許可されたIPアドレス」
# からのリクエストしか受け付けず、GitHub Actionsのランナーは毎回異なるAzureの
# IPから実行されるため、全リクエストが 403 CLIENT_IP_NOT_ALLOWED で失敗する。
# 実測済み: https://github.com/iroha0813/rakuten-room/actions/runs/33058423746
#
# 定期実行はローカルPCのタスクスケジューラが担う（scripts/run_daily.ps1）。
# 固定IPの実行環境を用意して楽天に登録すれば、下のcronを復活させられる。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-candidates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m room.pipeline

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "候補生成 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
